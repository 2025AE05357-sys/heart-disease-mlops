apiVersion: apps/v1
kind: Deployment
metadata:
  name: heartrisk-api
  labels:
    app.kubernetes.io/name: heartrisk-api
    app.kubernetes.io/component: inference
    app.kubernetes.io/part-of: heartrisk
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: heartrisk-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0        # never drop below the desired count during a rollout
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: heartrisk-api
        app.kubernetes.io/component: inference
        app.kubernetes.io/part-of: heartrisk
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
        # Filled in per release by k8s/components/release (a new model triggers a rollout).
        heartrisk.io/git-sha: unset
        heartrisk.io/model-version: unset
        heartrisk.io/model-run-id: unset
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: heartrisk-api:unset   # tag set per release by k8s/components/release
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: heartrisk-api-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Startup and liveness ask "is the process up?"; readiness asks "is a model loaded?".
          # A pod whose model fails to load stays out of the Service instead of crash-looping.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # On SIGTERM uvicorn stops accepting connections at once, but kube-proxy and the
          # LoadBalancer need a moment to drop the pod from the Service: keep serving for 5 s.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

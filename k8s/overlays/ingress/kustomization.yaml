# With an ingress controller (Traefik, decision D11): ClusterIP service behind an Ingress at
# http://heartrisk.localtest.me (the name resolves to 127.0.0.1, no hosts-file edit needed).
# Use instead of overlays/local, not together with it: both claim port 80 on localhost.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: heartrisk  # also covers objects generated by components
resources:
  - ../../base
  - ingress.yaml
components:
  - ../../components/release

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: heartrisk-api
  labels:
    app.kubernetes.io/name: heartrisk-api
    app.kubernetes.io/part-of: heartrisk
spec:
  ingressClassName: traefik
  rules:
    - host: heartrisk.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: heartrisk-api
                port:
                  name: http

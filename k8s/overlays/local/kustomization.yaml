# Docker Desktop, no ingress controller: expose the API as a LoadBalancer service, which
# Docker Desktop publishes on http://localhost:80.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: heartrisk  # also covers objects generated by components
resources:
  - ../../base
components:
  - ../../components/release
patches:
  - target:
      kind: Service
      name: heartrisk-api
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "heartrisk"
version = "0.1.0"
description = "Heart-disease risk classifier with an end-to-end MLOps pipeline (BITS AIMLCZG523, Assignment 1)"
readme = "README.md"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -p no:cacheprovider"
filterwarnings = [
    # raised inside MLflow's own SQLAlchemy models, not by project code
    "ignore:The ``noload`` loader strategy is deprecated:DeprecationWarning",
    "ignore:Any type hint is inferred as AnyType:UserWarning",
    "ignore::pandas.errors.Pandas4Warning:mlflow",
]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']

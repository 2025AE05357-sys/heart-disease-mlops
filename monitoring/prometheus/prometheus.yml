# Scrape every API pod that carries prometheus.io/scrape=true, discovered through the Kubernetes
# API, and label each series with the pod and the model version it serves.
global:
  scrape_interval: 5s          # short, so the drift demonstration moves within a minute
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: heartrisk-api
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [heartrisk]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        regex: "true"
        action: keep
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        regex: (.+)
        target_label: __metrics_path__
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_annotation_heartrisk_io_model_version]
        target_label: model_version

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
